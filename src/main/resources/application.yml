security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: project-review
    access-token-expires-minutes: ${ACCESS_TOKEN_EXPIRES_MINUTES}
    refresh-token-expires-days: ${REFRESH_TOKEN_EXPIRES_DAYS}

  app:
    frontend-origin: ${FRONTEND_ORIGIN}

spring:
  config:
    import: "optional:file:./.env[.properties]" # 실행 디렉터리의 .env를 설정 파일로 읽습니다.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require
#    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME} # Docker PostgreSQL 접속 주소
    username: ${DB_USERNAME} # POSTGRES_USER와 동일
    password: ${DB_PASSWORD}
  flyway:
    enabled: false # 운영에서 환경변수로 true 설정
    baseline-on-migrate: false
  data:
    web:
      pageable:
        max-page-size: 100
  h2:
    console:
      enabled: false

  jpa:
    properties:
      # 요청 DTO와 동일한 Jackson 3 JsonNode로 JSON 컬럼을 변환합니다.
      hibernate.type.json_format_mapper: jackson3
    hibernate:
      ddl-auto: validate
#    show-sql: true

# R2 입력값은 프로젝트 루트 .env에 작성합니다. 입력 예시는 .env.example을 참고합니다.
storage:
  endpoint: ${R2_ENDPOINT} # 업로드 서명용 S3 API 주소
  region: auto
  bucket: ${R2_BUCKET}
  access-key: ${R2_ACCESS_KEY_ID}
  secret-key: ${R2_SECRET_ACCESS_KEY}
  public-base-url: ${R2_PUBLIC_BASE_URL} # 조회용 공개 도메인 (버킷 이름 제외)
